<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#2563eb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Voice Translator">
<link rel="manifest" href="manifest.webmanifest">
<title>Voice Translator</title>
<style>
:root{--blue:#2563eb;--blue2:#1d4ed8;--bg:#f5f7fb;--card:#fff;--text:#172033;--muted:#7b8496;--line:#e4e8ef;--green:#16a34a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Helvetica Neue",Arial,sans-serif}
.app{max-width:560px;margin:0 auto;min-height:100vh;padding:env(safe-area-inset-top) 16px calc(28px + env(safe-area-inset-bottom))}
header{display:flex;align-items:center;justify-content:space-between;padding:18px 2px 12px}
.brand{display:flex;align-items:center;gap:11px}
.logo{width:42px;height:42px;border-radius:13px;background:var(--blue);display:grid;place-items:center;color:#fff;font-size:23px;box-shadow:0 7px 18px #2563eb33}
h1{font-size:21px;margin:0;font-weight:750}
.sub{font-size:12px;color:var(--muted);margin-top:2px}
.iconbtn{border:0;background:#fff;width:42px;height:42px;border-radius:13px;box-shadow:0 1px 3px #00000010;font-size:19px}
.card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:16px;margin-top:12px;box-shadow:0 6px 22px #18223008}
.langrow{display:grid;grid-template-columns:1fr 52px 1fr;gap:9px;align-items:center}
.langbox{background:#f7f9fc;border:1px solid var(--line);border-radius:17px;padding:9px 11px}
.langbox label{display:block;font-size:11px;color:var(--muted);margin-bottom:4px}
select{width:100%;border:0;background:transparent;font-size:17px;font-weight:650;color:var(--text);outline:none}
.swap{width:52px;height:52px;border:0;border-radius:17px;background:#eaf1ff;color:var(--blue);font-size:25px}
.status{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:12px;margin:12px 2px 0}
.dot{width:8px;height:8px;border-radius:50%;background:#b8c0cc}.dot.live{background:var(--green);box-shadow:0 0 0 5px #16a34a18}
.sectiontitle{font-size:12px;color:var(--muted);font-weight:650;margin-bottom:8px}
.text{font-size:22px;line-height:1.42;min-height:72px;white-space:pre-wrap;word-break:break-word}
.placeholder{color:#b4bcc9}
.actions{display:flex;gap:8px;margin-top:10px}
.smallbtn{border:0;background:#f3f5f8;color:var(--blue);border-radius:13px;padding:9px 13px;font-size:13px;font-weight:650}
.smallbtn:disabled{color:#aab1bd}
.result{background:linear-gradient(180deg,#f8fbff,#fff)}
.play{display:flex;align-items:center;gap:7px}
.miccard{text-align:center;padding:18px 14px 20px}
.modeBtns{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:15px}
.mode{border:0;border-radius:15px;padding:12px 8px;background:#f3f5f8;color:var(--blue);font-weight:700;font-size:14px}
.mode.active{background:#dce9ff}
.mic{width:116px;height:116px;border:0;border-radius:50%;background:var(--blue);color:#fff;font-size:46px;box-shadow:0 15px 30px #2563eb3d;transition:.15s transform,.15s background}
.mic.listening{background:#dc2626;transform:scale(1.07);box-shadow:0 0 0 13px #dc26261c,0 18px 35px #dc26263d}
.hint{font-size:13px;color:var(--muted);margin-top:13px}
.toolbar{display:flex;justify-content:space-between;align-items:center;margin-top:12px}
.clear{border:0;background:transparent;color:#7b8496;font-size:13px}
.history{margin-top:12px}
.item{padding:12px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item .a{font-size:14px;font-weight:650}
.item .b{font-size:14px;color:#536078;margin-top:3px}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);opacity:0;background:#172033;color:#fff;padding:11px 15px;border-radius:14px;font-size:13px;pointer-events:none;transition:.2s;z-index:5;max-width:90%;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.notice{font-size:11px;line-height:1.5;color:#8a93a3;text-align:center;padding:13px 8px}
@media(min-width:600px){body{padding:18px 0}.app{min-height:auto}}
</style>
</head>
<body>
<div class="app">
<header>
  <div class="brand"><div class="logo">文</div><div><h1>Voice Translator</h1><div class="sub">双向语音翻译 · 中文 · English · ไทย</div></div></div>
  <button class="iconbtn" id="clearBtn" title="清除">⌫</button>
</header>

<section class="card">
  <div class="langrow">
    <div class="langbox"><label>我说</label><select id="from">
      <option value="zh-CN">华语</option><option value="en-US">English</option><option value="th-TH">ไทย</option>
    </select></div>
    <button class="swap" id="swap" aria-label="交换语言">⇄</button>
    <div class="langbox"><label>对方说</label><select id="to">
      <option value="en-US">English</option><option value="zh-CN">华语</option><option value="th-TH">ไทย</option>
    </select></div>
  </div>
  <div class="status"><span class="dot" id="dot"></span><span id="status">准备就绪</span></div>
</section>

<section class="card">
  <div class="sectiontitle">原话</div>
  <div id="original" class="text placeholder">点击麦克风开始说话</div>
  <div class="actions"><button class="smallbtn" id="copyOriginal">复制</button></div>
</section>

<section class="card result">
  <div class="sectiontitle">翻译</div>
  <div id="translation" class="text placeholder">翻译结果会显示在这里</div>
  <div class="actions">
    <button class="smallbtn play" id="playBtn" disabled>🔊 播放</button>
    <button class="smallbtn" id="copyTranslation">复制</button>
  </div>
</section>

<section class="card miccard">
  <div class="modeBtns">
    <button class="mode active" id="pushMode">按住说话</button>
    <button class="mode" id="tapMode">点击开始/停止</button>
  </div>
  <button class="mic" id="mic" aria-label="麦克风">🎙️</button>
  <div class="hint" id="hint">按住麦克风，说完松开</div>
</section>

<section class="card history">
  <div class="toolbar"><div class="sectiontitle" style="margin:0">最近对话</div><button class="clear" id="historyClear">清空</button></div>
  <div id="historyList"><div class="notice">还没有翻译记录</div></div>
</section>

<div class="notice">需要网络连接。首次使用麦克风时，请允许浏览器访问麦克风。</div>
</div>
<div class="toast" id="toast"></div>

<script>
const $=id=>document.getElementById(id);
const from=$("from"),to=$("to"),original=$("original"),translation=$("translation"),mic=$("mic"),dot=$("dot"),statusEl=$("status"),hint=$("hint"),toast=$("toast"),playBtn=$("playBtn");
let recognition=null,listening=false,mode="push",lastSpeech="",lastTranslation="";

const langCode={ "zh-CN":"zh-CN","en-US":"en-US","th-TH":"th-TH" };
const speechName={"zh-CN":"zh-CN","en-US":"en-US","th-TH":"th-TH"};

function showToast(t){toast.textContent=t;toast.classList.add("show");clearTimeout(showToast.t);showToast.t=setTimeout(()=>toast.classList.remove("show"),2200)}
function setStatus(t,on=false){statusEl.textContent=t;dot.classList.toggle("live",on)}
function setText(el,text,placeholder=false){el.textContent=text;el.classList.toggle("placeholder",placeholder)}
function otherLang(){return to.value}
function swapLang(){const a=from.value;from.value=to.value;to.value=a;setStatus("已交换语言")}
$("swap").onclick=swapLang;

function setupRecognition(){
 const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(!SR){showToast("此浏览器不支持网页语音识别，请改用支持语音识别的浏览器");return null}
 const r=new SR(); r.lang=speechName[from.value]; r.continuous=false; r.interimResults=true; r.maxAlternatives=1;
 r.onstart=()=>{listening=true;mic.classList.add("listening");setStatus("正在听…",true);hint.textContent="正在听，请说话"}
 r.onresult=e=>{
   let finalText="", interim="";
   for(let i=e.resultIndex;i<e.results.length;i++){if(e.results[i].isFinal)finalText+=e.results[i][0].transcript;else interim+=e.results[i][0].transcript}
   if(interim) setText(original,interim,false);
   if(finalText){lastSpeech=finalText.trim();setText(original,lastSpeech,false);translate(lastSpeech)}
 }
 r.onerror=e=>{listening=false;mic.classList.remove("listening");setStatus(e.error==="not-allowed"?"麦克风权限被拒绝":"语音识别失败");if(e.error==="not-allowed")showToast("请在浏览器设置中允许麦克风")}
 r.onend=()=>{listening=false;mic.classList.remove("listening");if(statusEl.textContent==="正在听…")setStatus("准备就绪");hint.textContent=mode==="push"?"按住麦克风，说完松开":"点击麦克风开始，再点一次停止"}
 return r;
}
async function translate(text){
 setStatus("正在翻译…");
 setText(translation,"翻译中…",true);playBtn.disabled=true;
 const pair=from.value.split("-")[0]+"|"+to.value.split("-")[0];
 try{
   const url="https://api.mymemory.translated.net/get?q="+encodeURIComponent(text)+"&langpair="+encodeURIComponent(pair);
   const res=await fetch(url); const data=await res.json();
   const out=data?.responseData?.translatedText;
   if(!out)throw new Error();
   lastTranslation=out;setText(translation,out,false);playBtn.disabled=false;setStatus("翻译完成");addHistory(text,out);
   speak(out,to.value);
 }catch(e){setText(translation,"翻译服务暂时无法连接",true);setStatus("翻译失败，请检查网络");showToast("翻译服务暂时无法连接")}
}
function speak(text,lang){if(!("speechSynthesis" in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang=lang;speechSynthesis.speak(u)}
playBtn.onclick=()=>{if(lastTranslation)speak(lastTranslation,to.value)}
$("copyOriginal").onclick=()=>copy(original.textContent,"原话已复制");
$("copyTranslation").onclick=()=>copy(translation.textContent,"翻译已复制");
async function copy(t,msg){if(!t||t.startsWith("点击")||t.startsWith("翻译结果")||t==="翻译中…")return;try{await navigator.clipboard.writeText(t);showToast(msg)}catch{showToast("复制失败")}}
$("clearBtn").onclick=()=>{setText(original,"点击麦克风开始说话",true);setText(translation,"翻译结果会显示在这里",true);lastSpeech="";lastTranslation="";playBtn.disabled=true;setStatus("准备就绪")}

function addHistory(a,b){
 const arr=JSON.parse(localStorage.getItem("vt_history")||"[]");arr.unshift({a,b,time:Date.now()});localStorage.setItem("vt_history",JSON.stringify(arr.slice(0,10)));renderHistory()
}
function renderHistory(){
 const arr=JSON.parse(localStorage.getItem("vt_history")||"[]");const box=$("historyList");
 if(!arr.length){box.innerHTML='<div class="notice">还没有翻译记录</div>';return}
 box.innerHTML=arr.map(x=>`<div class="item"><div class="a">${escapeHtml(x.a)}</div><div class="b">${escapeHtml(x.b)}</div></div>`).join("")
}
function escapeHtml(s){return s.replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
$("historyClear").onclick=()=>{localStorage.removeItem("vt_history");renderHistory()}

function start(){
 if(listening){try{recognition?.stop()}catch{}return}
 recognition=setupRecognition(); if(!recognition)return; recognition.lang=from.value; try{recognition.start()}catch{}
}
function stop(){try{recognition?.stop()}catch{}}
mic.addEventListener("click",()=>{if(mode==="tap"){listening?stop():start()}})
mic.addEventListener("touchstart",e=>{if(mode==="push"){e.preventDefault();start()}},{passive:false});
["touchend","touchcancel"].forEach(ev=>mic.addEventListener(ev,e=>{if(mode==="push"){e.preventDefault();stop()}},{passive:false}));
mic.addEventListener("mousedown",e=>{if(mode==="push"){e.preventDefault();start()}});
["mouseup","mouseleave"].forEach(ev=>mic.addEventListener(ev,e=>{if(mode==="push"){e.preventDefault();stop()}}));
$("pushMode").onclick=()=>{mode="push";$("pushMode").classList.add("active");$("tapMode").classList.remove("active");hint.textContent="按住麦克风，说完松开"}
$("tapMode").onclick=()=>{mode="tap";$("tapMode").classList.add("active");$("pushMode").classList.remove("active");hint.textContent="点击麦克风开始，再点一次停止"}
from.onchange=()=>{if(recognition)recognition.lang=from.value;setStatus("已切换语言")}
to.onchange=()=>setStatus("已切换语言")
renderHistory();

if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))}
</script>
</body>
</html>
