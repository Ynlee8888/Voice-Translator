<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#2563eb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Voice Translator">
<link rel="manifest" href="manifest.webmanifest">
<title>Voice Translator</title>
<style>
:root{--blue:#2563eb;--blue2:#1d4ed8;--bg:#f5f7fb;--card:#fff;--text:#172033;--muted:#7b8496;--line:#e4e8ef;--green:#16a34a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Helvetica Neue",Arial,sans-serif}
.app{max-width:560px;margin:0 auto;min-height:100vh;padding:env(safe-area-inset-top) 16px calc(28px + env(safe-area-inset-bottom))}
header{display:flex;align-items:center;justify-content:space-between;padding:18px 2px 12px}
.brand{display:flex;align-items:center;gap:11px}
.logo{width:42px;height:42px;border-radius:13px;background:var(--blue);display:grid;place-items:center;color:#fff;font-size:23px;box-shadow:0 7px 18px #2563eb33}
h1{font-size:21px;margin:0;font-weight:750}
.sub{font-size:12px;color:var(--muted);margin-top:2px}
.iconbtn{border:0;background:#fff;width:42px;height:42px;border-radius:13px;box-shadow:0 1px 3px #00000010;font-size:19px}
.card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:16px;margin-top:12px;box-shadow:0 6px 22px #18223008}
.langrow{display:grid;grid-template-columns:1fr 52px 1fr;gap:9px;align-items:center}
.langbox{background:#f7f9fc;border:1px solid var(--line);border-radius:17px;padding:9px 11px}
.langbox label{display:block;font-size:11px;color:var(--muted);margin-bottom:4px}
select{width:100%;border:0;background:transparent;font-size:17px;font-weight:650;color:var(--text);outline:none}
.swap{width:52px;height:52px;border:0;border-radius:17px;background:#eaf1ff;color:var(--blue);font-size:25px}
.status{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:12px;margin:12px 2px 0}
.dot{width:8px;height:8px;border-radius:50%;background:#b8c0cc}.dot.live{background:var(--green);box-shadow:0 0 0 5px #16a34a18}
.sectiontitle{font-size:12px;color:var(--muted);font-weight:650;margin-bottom:8px}
.text{font-size:22px;line-height:1.42;min-height:72px;white-space:pre-wrap;word-break:break-word}
.placeholder{color:#b4bcc9}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.smallbtn{border:0;background:#f3f5f8;color:var(--blue);border-radius:13px;padding:9px 13px;font-size:13px;font-weight:650}
.smallbtn:disabled{color:#aab1bd}
.result{background:linear-gradient(180deg,#f8fbff,#fff)}
.play{display:flex;align-items:center;gap:7px}
.miccard{text-align:center;padding:18px 14px 20px}
.modeBtns{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:15px}
.mode{border:0;border-radius:15px;padding:12px 8px;background:#f3f5f8;color:var(--blue);font-weight:700;font-size:14px}
.mode.active{background:#dce9ff}
.mic{width:116px;height:116px;border:0;border-radius:50%;background:var(--blue);color:#fff;font-size:46px;box-shadow:0 15px 30px #2563eb3d;transition:.15s transform,.15s background}
.mic.listening{background:#dc2626;transform:scale(1.07);box-shadow:0 0 0 13px #dc26261c,0 18px 35px #dc26263d}
.hint{font-size:13px;color:var(--muted);margin-top:13px}
.toolbar{display:flex;justify-content:space-between;align-items:center;margin-top:12px}
.clear{border:0;background:transparent;color:#7b8496;font-size:13px}
.history{margin-top:12px}
.item{padding:12px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item .a{font-size:14px;font-weight:650}
.item .b{font-size:14px;color:#536078;margin-top:3px}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);opacity:0;background:#172033;color:#fff;padding:11px 15px;border-radius:14px;font-size:13px;pointer-events:none;transition:.2s;z-index:5;max-width:90%;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.notice{font-size:11px;line-height:1.5;color:#8a93a3;text-align:center;padding:13px 8px}
@media(min-width:600px){body{padding:18px 0}.app{min-height:auto}}
</style>
</head>
<body>
<div class="app">
<header>
  <div class="brand"><div class="logo">文</div><div><h1>听说翻译</h1><div class="sub">七种语言互译 · 华语对照 · 语音播放</div></div></div>
  <button class="iconbtn" id="clearBtn" title="清除">⌫</button>
</header>

<section class="card">
  <div class="langrow">
    <div class="langbox"><label>我说</label><select id="from">
      <option value="zh-CN">华语</option><option value="en-US">英语</option><option value="th-TH">泰语</option><option value="ja-JP">日语</option><option value="ko-KR">韩语</option><option value="ms-MY">马来语</option><option value="hi-IN">印地语（印度）</option>
    </select></div>
    <button class="swap" id="swap" aria-label="交换语言">⇄</button>
    <div class="langbox"><label>对方说</label><select id="to">
      <option value="en-US">英语</option><option value="zh-CN">华语</option><option value="th-TH">泰语</option><option value="ja-JP">日语</option><option value="ko-KR">韩语</option><option value="ms-MY">马来语</option><option value="hi-IN">印地语（印度）</option>
    </select></div>
  </div>
  <div class="status"><span class="dot" id="dot"></span><span id="status">准备就绪</span></div>
</section>

<section class="card">
  <div class="sectiontitle">原话</div>
  <textarea id="original" class="text" placeholder="点击麦克风说话，或输入文字" style="width:100%;border:0;background:transparent;font:inherit;font-size:22px;resize:vertical"></textarea>
  <div class="actions"><button class="smallbtn" id="copyOriginal">复制</button><button class="smallbtn" id="retryBtn">翻译原话</button></div>
</section>

<section class="card result">
  <div class="sectiontitle">翻译</div>
  <div id="translation" class="text placeholder">翻译结果会显示在这里</div>
  <div id="chinesePanel" hidden style="margin-top:16px;padding-top:14px;border-top:1px solid var(--line)">
    <div id="chineseCaption" class="sectiontitle">华语对照</div>
    <div id="chineseText" class="text" style="font-size:19px;min-height:0"></div>
  </div>
  <div class="actions">
    <button class="smallbtn play" id="playBtn" disabled>🔊 播放</button>
    <button class="smallbtn" id="copyTranslation">复制</button>
    <button class="smallbtn" id="soundTest">测试声音</button>
    <button class="smallbtn" id="verifyTranslation">用 Google 翻译核对 ↗</button>
  </div>
</section>

<section class="card miccard">
  <div class="modeBtns">
    <button class="mode active" id="pushMode">按住说话</button>
    <button class="mode" id="tapMode">点击开始/停止</button>
  </div>
  <button class="mic" id="mic" aria-label="麦克风">🎙️</button>
  <div class="hint" id="hint">按住麦克风，说完松开</div>
</section>

<section class="card history">
  <div class="toolbar"><div class="sectiontitle" style="margin:0">最近对话</div><button class="clear" id="historyClear">清空</button></div>
  <div id="historyList"><div class="notice">还没有翻译记录</div></div>
</section>

<div class="notice">修复版 v2.4 · 外语译文附华语对照，播放所选目标语言。免费翻译结果可能有误，可点击“用 Google 翻译核对”。新增日语、韩语、马来语、印地语。朗读取决于手机可用语音；缺少对应语音时会提示。需要网络连接。</div>
</div>
<div class="toast" id="toast"></div>

<script>

const $=id=>document.getElementById(id);
const from=$("from"),to=$("to"),original=$("original"),translation=$("translation"),mic=$("mic"),dot=$("dot"),statusEl=$("status"),hint=$("hint"),toast=$("toast"),playBtn=$("playBtn");
let recognition=null,state="idle",mode="tap",lastTranslation="",lastTarget="",requestId=0,controller=null,session=0,recordTimer=null;
function showToast(t){toast.textContent=t;toast.classList.add("show");clearTimeout(showToast.t);showToast.t=setTimeout(()=>toast.classList.remove("show"),3000)}
function setStatus(t,on=false){statusEl.textContent=t;dot.classList.toggle("live",on)}
function setText(el,t,p=false){if(el===original)el.value=t;else el.textContent=t;el.classList.toggle("placeholder",p)}
function resetMic(){clearTimeout(recordTimer);state="idle";mic.classList.remove("listening");hint.textContent=mode==="push"?"按住麦克风，说完松开":"点击麦克风开始，再点一次停止"}
function cancelRecording(){session++;const r=recognition;recognition=null;resetMic();try{r?.abort()}catch{}}
let chineseController=null;
function invalidate(){requestId++;controller?.abort();chineseController?.abort();$("chinesePanel").hidden=true;$("chineseText").textContent="";playBtn.disabled=true;lastTranslation="";window.speechSynthesis?.cancel()}
function start(){
 if(state!=="idle")return;
 const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(!SR){setStatus("此浏览器无法录音，可输入文字后点击翻译原话");return}
 invalidate();window.speechSynthesis?.cancel();
 const token=++session,r=new SR(),src=from.value,dst=to.value;
 recognition=r;state="starting";let parts=[],finished=false,error="",stopRequested=false;
 setText(original,"");setText(translation,"翻译结果会显示在这里",true);setStatus("正在启动麦克风…");
 r.lang=src;r.continuous=false;r.interimResults=true;r.maxAlternatives=1;
 const done=()=>{if(token!==session||finished)return;finished=true;recognition=null;resetMic();const text=parts.join(" ").trim();if(error){setStatus(error);return}if(text){original.value=text;translate(text,src,dst)}else setStatus("没有识别到文字，请重试或输入文字")};
 r.onstart=()=>{if(token!==session)return;state="listening";mic.classList.add("listening");setStatus("正在听…",true);hint.textContent="说完后点击停止";if(stopRequested)try{r.stop()}catch{}}
 r.onresult=e=>{if(token!==session)return;for(let i=e.resultIndex;i<e.results.length;i++)parts[i]=e.results[i][0].transcript;original.value=parts.join(" ").trim()};
 r.onerror=e=>{if(token!==session)return;error=({"not-allowed":"请在 Safari 网站设置中允许麦克风","audio-capture":"无法访问麦克风，请关闭其他录音应用","network":"语音识别网络出错，请重试","no-speech":"没有听到语音，请重试","aborted":"录音已取消"})[e.error]||"语音识别失败："+e.error;done()};
 r.onend=done;
 recordTimer=setTimeout(()=>{if(token!==session||finished)return;error="录音超时，请重试";try{r.abort()}catch{}done()},45000);
 r._stop=()=>{if(finished)return;stopRequested=true;state="stopping";setStatus("正在结束录音…");try{r.stop()}catch{}clearTimeout(recordTimer);recordTimer=setTimeout(()=>{try{r.abort()}catch{}done()},2500)};
 try{r.start()}catch(e){error="麦克风启动失败，请再试一次";done()}
}
function stop(){if(state!=="idle")recognition?._stop?.()}
async function translate(text,src=from.value,dst=to.value){
 text=text.trim();if(!text){showToast("请先说话或输入文字");return}
 controller?.abort();chineseController?.abort();$("chinesePanel").hidden=true;const id=++requestId,c=new AbortController();controller=c;setStatus("正在翻译…");setText(translation,"翻译中…",true);playBtn.disabled=true;lastTranslation="";
 const timer=setTimeout(()=>c.abort(),15000);
 try{
 let out=text;
 if(src!==dst){const codes={"zh-CN":"zh-CN","en-US":"en","th-TH":"th","ja-JP":"ja","ko-KR":"ko","ms-MY":"ms","hi-IN":"hi"};const url="https://api.mymemory.translated.net/get?q="+encodeURIComponent(text)+"&langpair="+encodeURIComponent(codes[src]+"|"+codes[dst]);const res=await fetch(url,{signal:c.signal});if(!res.ok)throw Error("翻译服务返回 "+res.status);const data=await res.json();if(Number(data.responseStatus)!==200)throw Error("翻译服务不可用或免费额度已用完");out=chooseTranslation(data,text,src,dst);if(!out)throw Error("翻译服务未返回译文")}
 if(id!==requestId)return;lastTranslation=out;lastTarget=dst;setText(translation,out);playBtn.disabled=false;setStatus("翻译完成；无声音请点击播放");addHistory(text,out);showChinese(text,src,dst,out,id);speak(out,dst);
 }catch(e){if(id!==requestId)return;const message=e.name==="AbortError"?"翻译超时，请点击翻译原话重试":e.message||"翻译失败，请重试";setText(translation,message,true);setStatus(message)}finally{clearTimeout(timer)}
}
async function showChinese(text,src,dst,out,id){
 if(dst==="zh-CN")return;
 $("chinesePanel").hidden=false;
 $("chineseCaption").textContent=src==="zh-CN"?"华语对照（原话）":"华语对照（原话的译文）";
 if(src==="zh-CN"){$("chineseText").textContent=text;return}
 $("chineseText").textContent="正在生成华语对照…";
 const c=new AbortController();chineseController=c;const timer=setTimeout(()=>c.abort(),15000);
 try{const code=src.split("-")[0];const res=await fetch("https://api.mymemory.translated.net/get?q="+encodeURIComponent(text)+"&langpair="+encodeURIComponent(code+"|zh-CN"),{signal:c.signal});if(!res.ok)throw Error();const data=await res.json();if(Number(data.responseStatus)!==200)throw Error();const chinese=chooseTranslation(data,text,src,"zh-CN");if(!chinese)throw Error();if(id===requestId)$("chineseText").textContent=chinese;
 }catch{if(id===requestId)$("chineseText").textContent="华语对照暂时无法取得，请点击翻译原话重试"}finally{clearTimeout(timer)}
}
function chooseTranslation(data,text,src,dst){
 const normalize=s=>String(s||'').normalize('NFKC').trim().replace(/[\s?!。，！？]+$/g,'');
 const exact=(Array.isArray(data.matches)?data.matches:[]).filter(x=>normalize(x.segment)===normalize(text)&&String(x.source||'').split('-')[0]===src.split('-')[0]&&String(x.target||'').split('-')[0]===dst.split('-')[0]&&x.translation);
 exact.sort((a,b)=>(Number(b.quality)||0)-(Number(a.quality)||0)||(Number(b.match)||0)-(Number(a.match)||0));
 return exact[0]?.translation||data.responseData?.translatedText;
}
let activeUtterance=null,speechToken=0,speechTimer=null,availableVoices=[];
function loadVoices(){try{availableVoices=window.speechSynthesis?.getVoices()||[]}catch{availableVoices=[]}}
loadVoices();window.speechSynthesis?.addEventListener?.('voiceschanged',loadVoices);
function speak(text,lang){
 const synth=window.speechSynthesis;
 if(!synth||!window.SpeechSynthesisUtterance&&typeof SpeechSynthesisUtterance==='undefined'){setStatus("浏览器不支持语音播放");return}
 cancelRecording();const token=++speechToken;clearTimeout(speechTimer);
 synth.cancel();synth.resume();loadVoices();
 const u=new SpeechSynthesisUtterance(text);activeUtterance=u;
 u.lang=lang;u.volume=1;u.rate=0.95;u.pitch=1;
 const voice=availableVoices.find(v=>v.lang.toLowerCase()===lang.toLowerCase())||availableVoices.find(v=>v.lang.toLowerCase().startsWith(lang.split('-')[0].toLowerCase()));if(voice)u.voice=voice;
 if(availableVoices.length&&!voice){setStatus("手机未提供所选语言的朗读语音");showToast("手机未提供所选语言的朗读语音");activeUtterance=null;return}
 let started=false;
 setStatus("正在启动朗读…");
 u.onstart=()=>{if(token!==speechToken)return;started=true;clearTimeout(speechTimer);setStatus("正在播放（如听不到，请检查声音输出）",true)};
 u.onend=()=>{if(token!==speechToken)return;clearTimeout(speechTimer);activeUtterance=null;setStatus("朗读已结束")};
 u.onerror=e=>{if(token!==speechToken)return;clearTimeout(speechTimer);activeUtterance=null;setStatus("朗读失败："+(e.error||"未知错误"));showToast("朗读失败："+(e.error||"未知错误"))};
 try{synth.speak(u);synth.resume();speechTimer=setTimeout(()=>{if(token!==speechToken||started||activeUtterance!==u)return;setStatus("朗读未启动；请用 Safari 打开，并再次点击播放")},5000)}catch(e){setStatus("朗读启动失败："+e.message)}
}
$("soundTest").onclick=()=>speak("Hello. This is a voice test.","en-US");
$("verifyTranslation").onclick=()=>{const text=original.value.trim();if(!text){showToast("请先输入原话");return}const codes={"zh-CN":"zh-CN","en-US":"en","th-TH":"th","ja-JP":"ja","ko-KR":"ko","ms-MY":"ms","hi-IN":"hi"};window.open("https://translate.google.com/?sl="+codes[from.value]+"&tl="+codes[to.value]+"&text="+encodeURIComponent(text)+"&op=translate","_blank","noopener,noreferrer")};
playBtn.onclick=()=>{if(lastTranslation)speak(lastTranslation,lastTarget)};
$("retryBtn").onclick=()=>{cancelRecording();translate(original.value)};
async function copy(text){try{await navigator.clipboard.writeText(text);showToast("已复制")}catch{showToast("复制失败")}}
$("copyOriginal").onclick=()=>copy(original.value);$("copyTranslation").onclick=()=>{if(lastTranslation)copy(lastTranslation)};
$("clearBtn").onclick=()=>{cancelRecording();invalidate();original.value="";setText(translation,"翻译结果会显示在这里",true);setStatus("准备就绪")};
function readHistory(){try{const a=JSON.parse(localStorage.getItem("vt_history")||"[]");return Array.isArray(a)?a:[]}catch{return[]}}
function addHistory(a,b){try{const arr=readHistory();arr.unshift({a,b,time:Date.now()});localStorage.setItem("vt_history",JSON.stringify(arr.slice(0,10)));renderHistory()}catch{}}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function renderHistory(){const arr=readHistory();$("historyList").innerHTML=arr.length?arr.map(x=>`<div class="item"><div class="a">${escapeHtml(x.a)}</div><div class="b">${escapeHtml(x.b)}</div></div>`).join(""):'<div class="notice">还没有翻译记录</div>'}
$("historyClear").onclick=()=>{try{localStorage.removeItem("vt_history")}catch{}renderHistory()};
function changeLang(){cancelRecording();invalidate();setText(translation,"翻译结果会显示在这里",true);setStatus("语言已切换，请重新说话或翻译原话")}
$("swap").onclick=()=>{const a=from.value;from.value=to.value;to.value=a;changeLang()};from.onchange=changeLang;to.onchange=changeLang;
mic.style.touchAction="none";
mic.addEventListener("click",()=>{if(mode==="tap")state==="idle"?start():stop()});
mic.addEventListener("pointerdown",e=>{if(mode!=="push")return;e.preventDefault();mic.setPointerCapture?.(e.pointerId);start()});
["pointerup","pointercancel","lostpointercapture"].forEach(ev=>mic.addEventListener(ev,()=>{if(mode==="push")stop()}));
function setMode(m){cancelRecording();mode=m;$("pushMode").classList.toggle("active",m==="push");$("tapMode").classList.toggle("active",m==="tap");resetMic();setStatus("准备就绪")}
$("pushMode").onclick=()=>setMode("push");$("tapMode").onclick=()=>setMode("tap");
document.addEventListener("visibilitychange",()=>{if(document.hidden){cancelRecording();invalidate()}});
setMode("tap");renderHistory();
// Remove the previous cache so this repaired HTML can update on subsequent visits.
if("serviceWorker" in navigator)navigator.serviceWorker.getRegistrations().then(rs=>Promise.all(rs.filter(r=>r.scope===new URL('./',location.href).href).map(r=>r.unregister()))).catch(()=>{});

</script>
</body>
</html>
